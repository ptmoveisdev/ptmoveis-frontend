<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Em Manutenção – PT Móveis</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #333;
    }

    .card {
      text-align: center;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 90%;
    }

    .card img {
      max-width: 200px;
      height: auto;
      margin-bottom: 2rem;
    }

    .card h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #1a1a1a;
    }

    .card p {
      font-size: 1rem;
      line-height: 1.6;
      color: #555;
    }

    .icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="PT Móveis" />
    <span class="icon">🔧</span>
    <h1>Site em manutenção</h1>
    <p>Estamos a trabalhar para melhorar a sua experiência.<br />Voltamos em breve!</p>
  </div>
</body>
</html>
